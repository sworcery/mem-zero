name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Gitea Actions only (GitHub ignores .gitea/). The GitHub workflow in
# .github/workflows is gated to github.com, so Gitea skips it. No tests run
# here; the local suite is the gate.
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Compare the push's before/after SHAs by hand. workflow_dispatch has no
      # "before", and a first push or force push has a null/all-zero one, so
      # those always build.
      - name: Detect relevant changes
        id: filter
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch always builds" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=no usable previous commit - building to be safe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$AFTER" -- src/ pyproject.toml requirements.txt Dockerfile rootfs/ .gitea/workflows/build.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=relevant paths changed" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reason=no relevant paths changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.filter.outputs.changed != 'true'
        run: echo "::notice::Skipping build - ${{ steps.filter.outputs.reason }}"

      # The registry is this Gitea instance, so its host comes from the server
      # URL rather than being written into a public repo.
      - name: Read version and registry
        id: meta
        if: steps.filter.outputs.changed == 'true'
        run: |
          echo "ver=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mem_zero/__init__.py)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          host="${GITHUB_SERVER_URL#*://}"
          echo "registry=${host%/}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The job's docker.sock is the runner host's daemon, so these tags land
      # in its local image store directly.
      - name: Build image
        if: steps.filter.outputs.changed == 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            -t mem-zero:latest \
            -t "mem-zero:${{ steps.meta.outputs.ver }}" \
            -t "mem-zero:${{ steps.meta.outputs.short_sha }}" \
            .
          docker images mem-zero

      # Optional: a no-op (not a failure) until REGISTRY_TOKEN is configured.
      - name: Check registry token
        id: registry
        if: steps.filter.outputs.changed == 'true'
        run: |
          if [ -n "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Gitea registry
        if: steps.filter.outputs.changed == 'true' && steps.registry.outputs.push == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
        run: echo "$REGISTRY_TOKEN" | docker login "${{ steps.meta.outputs.registry }}" -u "${REGISTRY_USER:-${{ steps.meta.outputs.owner }}}" --password-stdin

      # :latest moves; :v<version> and :<sha> are never overwritten (rollback targets).
      - name: Push to Gitea registry
        if: steps.filter.outputs.changed == 'true' && steps.registry.outputs.push == 'true'
        run: |
          img="${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.owner }}/mem-zero"
          for tag in latest "v${{ steps.meta.outputs.ver }}" "${{ steps.meta.outputs.short_sha }}"; do
            docker tag mem-zero:latest "$img:$tag"
            docker push "$img:$tag"
          done

      - name: Log out of Gitea registry
        if: always() && steps.filter.outputs.changed == 'true' && steps.registry.outputs.push == 'true'
        run: docker logout "${{ steps.meta.outputs.registry }}"
