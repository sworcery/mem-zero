[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem-zero"
version = "0.1.35.2"
description = "Project-isolated MCP memory server"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Gadsden LLC", email = "hello@gadsden.io"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.9",
    "qdrant-client>=1.12",
    "httpx>=0.28",
    "pydantic>=2.10",
    "anyio>=4.0",
    "llama-cpp-python>=0.3",
    "fastembed>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mem-zero = "mem_zero.__main__:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: Docker-backed container tests",
]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
