[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mem_zero/__init__.py"

[project]
name = "mem-zero"
dynamic = ["version"]
description = "Project-isolated MCP memory server"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{name = "Gadsden LLC", email = "hello@gadsden.io"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # <2 is load-bearing: mcp 2.0 restructured the package and removed
    # mcp.server.fastmcp, which mcp_server.py imports.
    "mcp>=1.9,<3",
    "qdrant-client>=1.12",
    "httpx>=0.28",
    "pydantic>=2.10",
    "anyio>=4.0",
    "numpy>=1.24",
    "llama-cpp-python>=0.3",
    "fastembed>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.28"]

[project.scripts]
mem-zero = "mem_zero.__main__:main"
mem-zero-cli = "mem_zero.cli:main"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: Docker-backed container tests",
]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
