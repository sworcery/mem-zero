services:
  mem-zero:
    image: ghcr.io/sworcery/mem-zero:latest
    container_name: mem-zero
    ports:
      - "8765:8765"
    volumes:
      - mem-zero-storage:/mem0/storage
    environment:
      # Backend: "bundled" (default, self-contained), "ollama", or "openai"
      # Auto-detected from env vars if not set explicitly.
      # - LLM_BACKEND=bundled

      # Ollama settings (only used when LLM_BACKEND=ollama)
      # - OLLAMA_BASE_URL=http://your-ollama-host:11434
      # - LLM_MODEL=qwen2.5:7b
      # - EMBEDDER_MODEL=nomic-embed-text

      # OpenAI settings (only used when LLM_BACKEND=openai)
      # - OPENAI_API_KEY=sk-...
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # - OPENAI_MODEL=gpt-4o-mini

      - EMBEDDER_DIMENSIONS=768

      # API key for MCP and REST endpoints (generate with: openssl rand -hex 32)
      # - API_KEY=your-api-key-here

      # - DASHBOARD_USER=admin
      # - DASHBOARD_PASS=changeme
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mem-zero-storage:
