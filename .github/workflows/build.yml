name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # Derived from pyproject so the list cannot drift out of sync (a
        # hand-written copy silently missed the mcp<2 pin). Skips
        # llama-cpp-python and fastembed: both are imported lazily inside
        # BundledBackend, which the tests mock, and llama-cpp-python compiles
        # C++ for ~10 minutes in CI.
        run: |
          pip install tomli
          python -c "
          import pathlib, tomli
          d = tomli.loads(pathlib.Path('pyproject.toml').read_text())
          skip = ('llama-cpp-python', 'fastembed')
          deps = [x for x in d['project']['dependencies'] if not x.startswith(skip)]
          print('\n'.join(deps))
          " > /tmp/deps.txt
          cat /tmp/deps.txt
          pip install -r /tmp/deps.txt "pytest>=8.0" "pytest-asyncio>=0.23" ruff

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Lint
        run: python -m ruff check src/ tests/

  lint-shell:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: shellcheck
        # SC2164 excluded: services.d/qdrant/run does `cd /qdrant` without
        # `|| exit` (pre-existing, harmless: the path is baked into the image).
        run: shellcheck -s bash -S warning -e SC2164 rootfs/etc/cont-init.d/*.sh rootfs/etc/services.d/*/run

      - name: bash -n
        run: |
          for f in rootfs/etc/cont-init.d/*.sh rootfs/etc/services.d/*/run; do
            bash -n "$f" || exit 1
          done

  build:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [test, lint-shell]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Fall back to ECR when ghcr.io rate-limits anonymous DB pulls.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(PYTHONPATH=src python3 -c 'import mem_zero; print(mem_zero.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches __version__ $version"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # TODO(arm64): native ubuntu-24.04-arm matrix + imagetools create merge; QEMU llama-cpp compile is 30-60+ min and load:true does not support multi-platform.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}`
            Digest: `${{ steps.build.outputs.digest }}`
