name: Build and Push

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # Derived from pyproject so the list cannot drift out of sync (a
        # hand-written copy silently missed the mcp<2 pin). Skips
        # llama-cpp-python and fastembed: both are imported lazily inside
        # BundledBackend, which the tests mock, and llama-cpp-python compiles
        # C++ for ~10 minutes in CI.
        run: |
          pip install tomli
          python -c "
          import pathlib, tomli
          d = tomli.loads(pathlib.Path('pyproject.toml').read_text())
          skip = ('llama-cpp-python', 'fastembed')
          deps = [x for x in d['project']['dependencies'] if not x.startswith(skip)]
          print('\n'.join(deps))
          " > /tmp/deps.txt
          cat /tmp/deps.txt
          pip install -r /tmp/deps.txt "pytest>=8.0" "pytest-asyncio>=0.23" ruff

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Lint
        run: python -m ruff check src/ tests/

  build:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
